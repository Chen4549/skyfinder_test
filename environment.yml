name: mmt-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.6.0
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - pandas
  - scikit-learn
  - matplotlib
  - tqdm
  - tensorboard
  - pip
  - pip:
      - tabpfn
      - transformers
      - datasets
      - evaluate
      - accelerate
      - timm
      - wandb
      - tensorboard-logger
      - opencv-python
      - imgaug